services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: ticketswap
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: ticketswap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketswap -d ticketswap"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
